# paper-video configuration. Every key is required; there are no hidden defaults.

[agy]
# Metadata for PDFs that carry none uses the Antigravity CLI (`agy`).
model = "gemini-3.8-flash-high"
# Wall-clock limit for one call.
timeout_seconds = 600

[tts]
# ElevenLabs; ELEVENLABS_API_KEY lives in the repository's ignored .env.
# Jarnathan - Confident and Versatile, selected for this series.
model = "eleven_v4"
voice = "c6SfcYrb2t09NHXiT80T"
stability = 0.5
similarity_boost = 0.75
seed = 42
timeout_seconds = 180

[render]
resolution = [1920, 1080]
frame_rate = 60
# Scenes rendered at once (also the number of scene subagents to run at once).
parallel_scenes = 3
# Silence after each narrated beat, in seconds.
beat_pause = 0.35

[publish]
media_bucket = "aisafetyrisks-media"
site_url = "https://aisafetyrisks.org"

[backup]
volume = "/Volumes/Expansion"
root = "/Volumes/Expansion/ROOT/Projects/Toronto (2026+)/AI Safety Risks/Media Backups"

[social]
# Zernio schedules the weekly release; ZERNIO_API_KEY lives in the repository's ignored .env.
# Each week releases one published explainer: the long-form video on YouTube, then its short
# on YouTube Shorts and Instagram Reels. Times are wall-clock times in `timezone`.
timezone = "America/Toronto"
long_form_day = "tuesday"
short_day = "thursday"
time = "09:00"
# Zernio account ids (GET /v1/accounts): YouTube "AI Safety Risks", Instagram @aisafetyrisks.
youtube_account = "6ac076426a8221b3712d1719"
instagram_account = "6aa756ae726ebfe037e7c681"
# Wall-clock limit for one API call or media upload.
timeout_seconds = 600
