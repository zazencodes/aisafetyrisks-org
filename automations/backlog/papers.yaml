# Research backlog for aisafetyrisks.org: every paper the site will explain, and how far each has got.
#
# Papers from roughly the last decade of technical AI safety research, chosen for influence and
# teaching value across the field's main problem areas. Inclusion is not an endorsement of a
# paper's conclusions. Titles, authors and dates for arXiv papers are copied from the arXiv API;
# other entries were checked against their landing pages.
#
# Order: oldest first, by `published`, the date the work was first made public (arXiv v1 for
# arXiv papers). `paper-video` refuses to load the file if this order is broken, so insert new
# papers at their date.
#
# status (the checkbox):
#   queued       not started
#   in_progress  ingested; the draft is being made or is waiting for human review
#   published    approved with `paper-video approve` (the user does this)
# The pipeline sets `status` and `work` (the site slug): in_progress on `paper-video ingest`,
# published on `paper-video approve`. Do not edit them by hand.
#
# Working through the list: take the first `queued` paper and run
# workflows/publish-paper/WORKFLOW.md for it. One paper per session. When a paper cited on
# site/content/pages/doomsday.md is published, link its explainer there next to the paper link.
#
# `uv run --frozen paper-video backlog` prints the list with statuses.
#
# category is one of the site categories in site/src/aisr_site/schema.py.

