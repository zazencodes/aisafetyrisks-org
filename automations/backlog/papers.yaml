# Research shortlist for aisafetyrisks.org: the only papers the site will explain, and how far each
# has got. Process nothing else; candidates that did not make the cut are in longlist.yaml.
#
# The shortlist keeps only landmark technical AI safety papers, one per idea, that together tell
# the field's story from early predictions to current evidence of misalignment. Inclusion is not an
# endorsement of a paper's conclusions. Titles, authors and dates for arXiv papers are copied from
# the arXiv API; other entries were checked against their landing pages. `published` is the date
# the work was first made public (arXiv v1 for arXiv papers). Where only the year or month is known
# (an undated lecture, a monthly issue), it is the first day of that year or month.
#
# Pre-2007 entries trace the field's prehistory: goal-directed machines (1943), loss of control
# (1951), specification (1960), intelligence explosion (1965), Friendly AI as a design problem
# (2001) and the superintelligence motivation problem (2003). Turing's lecture has no text PDF
# online; ingest the OCR of the King's College typescript (two drafts, public domain) in
# backlog/sources/ with `--source-url` set to its `link`. Good's PDF is an OCR scan: check quotes
# against the page images.
#
# Two entries were published before the shortlist was drawn up and would not make it on merit:
# The Off-Switch Game and Stress Testing Deliberative Alignment for Anti-Scheming Training. They
# stay here, published, in date order.
#
# Order: chronological by `published`, oldest first, so explainers and social posts follow the
# field's history. Papers are processed in the order they appear; insert a new paper at its date.
# `paper-video` refuses to load the file if it is out of order.
#
# status (the checkbox):
#   queued       not started
#   in_progress  ingested; generation, checks or publication are incomplete
#   published    approved with `paper-video approve` under standing user authorization
# The pipeline sets `status` and `work` (the site slug): in_progress on `paper-video ingest`,
# published on `paper-video approve`. Do not edit them by hand.
#
# Working through the list: take the first `queued` paper and run
# workflows/publish-paper/WORKFLOW.md through approval/deployment as soon as checks pass; no
# personal review or publication confirmation is required. One paper per session. When a paper cited on
# site/content/pages/doomsday.md is published, link its explainer there next to the paper link.
#
# `uv run --frozen paper-video backlog` prints the list with statuses.
#
# category is one of the site categories in site/src/aisr_site/schema.py.

