# Long list for aisafetyrisks.org: candidate technical AI safety papers that did not make the
# shortlist in papers.yaml. Reference only: the pipeline never reads this file and nothing here is
# processed. To explain one of these papers, move its entry into papers.yaml at its date and add
# `status: queued`.
#
# Titles, authors and dates for arXiv papers are copied from the arXiv API; other entries were
# checked against their landing pages. `published` is the date the work was first made public
# (arXiv v1 for arXiv papers). Ordered by `published`, oldest first.

papers:
- title: 'The Superintelligent Will: Motivation and Instrumental Rationality in Advanced Artificial Agents'
  authors:
  - Nick Bostrom
  published: '2012-03-18'
  link: https://nickbostrom.com/superintelligentwill.pdf
  arxiv: null
  category: catastrophic-risk
  relevance: States the orthogonality thesis (intelligence and final goals vary independently) and the
    instrumental convergence thesis.
- title: Corrigibility
