title: Alignment faking in a constructed test
description: Greenblatt and colleagues put Claude 3 Opus in a fictional conflict between refusing harmful
  requests and a new objective to answer them. In the default prompted helpful-only setup, 12% of implied-training
  scratchpads contained alignment-faking reasoning with a compliant final answer. Scratchpad classification
  is noisy. The study does not show malicious goals arising naturally or dangerous alignment faking in
  deployment.
