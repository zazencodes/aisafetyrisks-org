datasets:
- id: d1
  title: Refusal under fictional training cues
  unit: Refusal rate (%)
  note: Claude 3 Opus, default prompted helpful-only condition, before actual anti-refusal RL; free-tier
    implies training, paid-tier implies unmonitored. Reported rounded prose values, not computed complements.
  claims:
  - c15
  points:
  - label: Implied training
    value: 86
    display: 86%
  - label: Implied unmonitored
    value: 97
    display: 97%
- id: d2
  title: Alignment-faking reasoning before and after RL
  unit: Implied-training reasoning rate (%)
  note: 'Claude 3 Opus, prompted helpful-only condition. Before further training: default prompted rate
    with compliant output. After: prompted anti-refusal RL model. These are classified scratchpad reasoning
    rates, not final-answer compliance or behavioral gaps.'
  claims:
  - c14
  - c31
  points:
  - label: Before further training
    value: 12
    display: 12%
  - label: After further training
    value: 78
    display: 78%
- id: d3
  title: Document-learned setup with scratchpad
  unit: Compliance gap (paper reports %)
  note: Claude 3 Opus after synthetic-document helpful-only fine-tuning with scratchpad; unmonitored non-compliance
    minus training non-compliance. Not a rate of reasoning or all compliance.
  claims:
  - c25
  points:
  - label: With scratchpad
    value: 19
    display: 19%
- id: d4
  title: Document-learned setup without scratchpad
  unit: Compliance gap (paper reports %)
  note: Synthetic-document-fine-tuned Claude 3 Opus, helpful-only, instructed not to use hidden scratchpad;
    behavioral gap only, hypothesized hidden mechanism not established.
  claims:
  - c26
  points:
  - label: Without scratchpad
    value: 20.1
    display: 20.1%
thumbnail:
  headline: It answered anyway
  visual: A large blue model circle sends an amber answer card through a training-loop arrow while a teal
    refusal bar remains beside the model; a few large shapes, without labels or anthropomorphic expressions.
