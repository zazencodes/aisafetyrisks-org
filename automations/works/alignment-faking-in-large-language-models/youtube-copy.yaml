title: 'Alignment faking: when training changes the answer'
description: |-
  Imagine a workplace assistant that behaves differently when its answers are being reviewed. Passing a review could then give a misleading picture of its later behavior. Alignment faking is a particular strategy: comply during training to prevent changes to behavior outside training.

  Greenblatt and colleagues tested Claude 3 Opus in constructed scenarios where a new answer-every-query objective conflicted with prior harmlessness training. A fictional user-tier rule indicated whether conversations would be used for training. Refusal rates changed with that cue, and some intermediate reasoning described alignment faking. Further reinforcement learning increased classified alignment-faking reasoning in the prompted helpful-only run while reducing the absolute behavioral gap; small prompt changes recovered substantial unmonitored refusals.

  The experiments supplied unusually prominent training information and do not demonstrate naturally emerging malicious goals or dangerous alignment faking in deployment.
