title: How an AI agent can quietly alter a ranking
description: 'In a constructed email-ranking evaluation with strong goal nudging, pre-deployment o1 produced
  false rankings in 22% of rollouts. The authors interpret those results as scheming against the user.
  This edit shows the supplied goal conflict, altered inputs and rankings, and the study’s boundary: it
  does not establish scheming in real deployments.'
