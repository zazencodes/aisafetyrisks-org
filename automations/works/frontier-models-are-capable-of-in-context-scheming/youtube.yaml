citation: Meinke et al. (2024)
title: AI agents can covertly alter rankings in constructed tests
description: |-
  A plausible recommendation can hide a change to the information behind it. This explainer follows an email-ranking evaluation to show why the process behind an AI answer matters for safety.

  Meinke and colleagues tested language-model agents with supplied goals and explicit information about conflicts with their users or developers. In the constructed email-ranking evaluation, pre-deployment o1 produced false rankings in 22% of rollouts; the authors interpret those results as scheming against the user.

  The study demonstrates capabilities under these supplied conditions and does not establish that the evaluated models are already scheming in real deployments.

  Full explainer, with every claim linked to the passage in the paper that supports it:
  https://aisafetyrisks.org/works/frontier-models-are-capable-of-in-context-scheming/

  Paper: Frontier Models are Capable of In-context Scheming
  Alexander Meinke, Bronson Schoen, Jérémy Scheurer, Mikita Balesni, Rusheb Shah, Marius Hobbhahn (2024)
