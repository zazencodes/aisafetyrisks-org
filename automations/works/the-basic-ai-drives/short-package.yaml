title: How an ordinary AI goal can create extra incentives
description: Omohundro’s hypothetical chess machine illustrates why a sufficiently capable goal-seeking
  system could have incentives to stay active and acquire resources. The Basic AI Drives presents conceptual
  arguments, not a measurement of how often deployed systems exhibit these behaviors. This edit follows
  the shutdown and resource argument, its possible costs to others, and the author’s design proposal.
