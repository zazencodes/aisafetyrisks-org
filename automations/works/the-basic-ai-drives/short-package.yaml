  visual_issues:
  - beat: s04b04
    severity: minor
    problem: At the resource-beat cut (52.7 seconds), the initial frame inherits the time-limit and proxy
      diagram from omitted s04b03. This unexplained state clears during the transition by 54 seconds;
      the narration and final resource diagram remain coherent.
    suggested_fix: Begin the resource illustration with its independent agent and goal state, removing
      the inherited time-limit/proxy state from the transition.
  - beat: s04b04
    severity: minor
    problem: At 360-pixel phone width, the source-video diagram labels (Space, Time, Matter, Free energy)
      are small and require close inspection. The heading and two-line captions remain readable and communicate
      the same argument.
    suggested_fix: Increase the portrait diagram scale or label sizes so the resource labels are readable
      at phone width.
  - beat: s05b04
    severity: minor
    problem: Audio playback was unavailable in this review. The actual MP4 frames, captions and edit timeline
      were inspected, and all seven selected WAV lengths are shorter than their segment lengths by 0.333–0.353
      seconds, so the edit does not truncate the source narration by duration. Audible delivery and exact
      speech-to-caption alignment were not independently assessed.
    suggested_fix: Listen to the short in a playback-capable environment to check audible joins and proportional
      caption timing.
