title: Why a simple AI goal could create risky incentives
description: |-
  Imagine a hypothetical chess machine assigned to win games. Stephen Omohundro argues that this ordinary goal could make continued operation, copies and resources useful, creating a safety problem for the people around it.

  The Basic AI Drives develops conceptual arguments about sufficiently capable goal-seeking systems. This animated explainer follows self-improvement, goal preservation, the difference between real wins and an editable counter, and incentives for self-preservation and resource acquisition. It keeps the conditions attached to the counter example and distinguishes the author’s design proposals from implemented protections.

  These are arguments illustrated with hypothetical systems; the paper does not measure how frequently these behaviors occur in deployed AI.
