title: How an ordinary AI goal can create extra incentives
description: >-
  Omohundro’s hypothetical chess machine illustrates why a sufficiently capable goal-seeking system could have incentives to stay active and acquire resources. The Basic AI Drives presents conceptual arguments, not a measurement of how often deployed systems exhibit these behaviors. This edit follows the shutdown and resource argument, its possible costs to others, and the author’s design proposal.
scope_label: Conceptual argument · hypothetical systems
selection_reason: >-
  The chess hook explicitly establishes a hypothetical system and the off-switch concern. The paper introduction attributes the conceptual method, followed by complete beats on self-preservation, resources and harms to others. The spoken limitation precedes a takeaway about designing around incentives. This edit omits self-improvement, utility-preservation exceptions, counter manipulation and proxy time limits to keep one coherent account. The selected cuts retain independent agent/goal diagrams; the resource beat's original-goal label refers back to the chess assignment, without relying on the omitted helper explanation.
