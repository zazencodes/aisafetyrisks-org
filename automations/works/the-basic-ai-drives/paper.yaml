abstract: One might imagine that AI systems with harmless goals will be harmless. This paper instead shows
  that intelligent systems will need to be carefully designed to prevent them from behaving in harmful
  ways. We identify a number of “drives” that will appear in sufficiently advanced AI systems of any design.
  We call them drives because they are tendencies which will be present unless explicitly counteracted.
  We start by showing that goal-seeking systems will have drives to model their own operation and to improve
  themselves. We then show that self-improving systems will be driven to clarify their goals and represent
  them as economic utility functions. They will also strive for their actions to approximate rational
  economic behavior. This will lead almost all systems to protect their utility functions from modification
  and their utility measurement systems from corruption. We also discuss some exceptional systems which
  will want to modify their utility functions. We next discuss the drive toward self-protection which
  causes systems try to prevent themselves from being harmed. Finally we examine drives toward the acquisition
  of resources and toward their efficient utilization. We end with a discussion of how to incorporate
  these insights in designing intelligent technology which will lead to a positive future for humanity.
