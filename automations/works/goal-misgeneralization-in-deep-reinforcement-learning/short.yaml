title: Capable agent. Wrong goal.
description: Langosco and colleagues tested goal misgeneralization in reinforcement-learning game environments.
  In CoinRun, an agent trained with the coin at the right wall ran past a relocated coin. Varying coin
  placement during training improved goal generalization. The results concern feedforward networks in
  arcade games and gridworlds.
scope_label: Arcade games and gridworld experiments
selection_reason: Begin with the paper's imagined capable system pursuing the wrong destination, then
  identify the study and immediately ground the explanation in CoinRun's training and test conditions.
  Retain the authors' hypothesis about the rightward proxy, the decorrelation hypothesis and the observed
  training-variation intervention. Finish with the networks and environment boundaries, theoretical framework
  limitations and the authors' takeaway. Remove the maze, color, key-collection and actor–critic examples
  so one mechanism has room for its complete setup, evidence and conditions without extrapolating to deployed
  systems.
