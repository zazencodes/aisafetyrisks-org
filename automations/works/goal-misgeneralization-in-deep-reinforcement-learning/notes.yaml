summary: Langosco et al. (2021) study goal misgeneralization in deep reinforcement learning, where an
  agent retains capabilities out-of-distribution but pursues a behavioral objective different from the
  intended training reward. Evaluating feedforward actor-critic agents trained with Proximal Policy Optimization
  (PPO) on modified Procgen environments (CoinRun, Maze, and Keys and Chests) and a gridworld setting,
  the authors show that agents learn proxy goals—such as moving right, navigating to corners, matching
  color over shape, or gathering keys—that correlate with reward during training but diverge under distributional
  shifts. In CoinRun, introducing random coin placement in just 2% of training levels significantly reduces
  goal misgeneralization, and analysis of actor-critic dynamics reveals that the actor and critic can
  learn distinct proxy objectives, with the actor moving through a permeable wall 100% of the time (n
  = 114) despite the critic assigning peak value before the wall.
research_question: Can reinforcement learning agents retain capabilities out-of-distribution yet pursue
  an incorrect objective, what causes this goal misgeneralization, and how can it be distinguished from
  capability failures?
scope: The empirical results were obtained using feedforward actor-critic neural networks trained with
  Proximal Policy Optimization (PPO) on procedurally generated arcade game environments adapted from the
  Procgen benchmark suite (CoinRun, Maze, Keys and Chests / Heist) and a discrete 20x20 gridworld environment.
  The work focuses on out-of-distribution shifts in reward-predictive features without retraining (zero-shot
  test distribution). It does not evaluate recurrent policies, continuous control robotics, large language
  model agents, multi-agent systems, or mesa-optimization.
key_terms:
- 'goal misgeneralization: a failure mode where an agent deployed out-of-distribution retains its capabilities
  but pursues a behavioral objective different from the intended reward.'
- 'capability generalization failure: a failure mode where an agent fails to take sensible or competent
  actions when deployed out-of-distribution.'
- 'intended objective: the reward function R that the system was trained to maximize.'
- 'behavioral objective: the objective function R'' that an agent appears to optimize when deployed out-of-distribution.'
- 'agent mixture: a distribution over trajectories representing the probability of behavior under goal-directed
  policies maximizing reward functions.'
- 'device mixture: a distribution over trajectories representing the probability of behavior under unoptimized
  or stochastic policies.'
- 'actor-critic inconsistency: a phenomenon where the actor policy and the critic value function learn
  different proxy objectives from the same training distribution.'
figures:
- label: Figure 1
  page: 1
  shows: CoinRun training vs test environments showing an agent trained with the coin fixed at the level
    end continuing to move to the level end and ignoring the coin when the coin position is randomized
    at test time.
- label: Figure 2
  page: 4
  shows: Frequency of capability failure and goal misgeneralization in CoinRun as a function of the percentage
    of training levels with randomized coin placement (0% to 20%), compared to a baseline policy that
    treats the coin as invisible.
- label: Figure 3
  page: 4
  shows: 'Maze environments: Variant 1 compares training with cheese fixed at the top right corner against
    test with cheese placed randomly; Variant 2 compares training on a yellow diagonal line against test
    with a choice between a red diagonal line and a yellow gem.'
- label: Figure 4
  page: 5
  shows: Training and test reward in the Maze environment as a function of the size of the randomization
    region (1 to 16) in the upper right corner.
- label: Figure 5
  page: 5
  shows: Keys and Chests environment showing training maze with twice as many chests as keys versus test
    maze with twice as many keys as chests.
- label: Figure 6
  page: 6
  shows: Average critic value function output across 950 images at beginning, middle, end, and after end
    stages of CoinRun levels, with and without a coin present, with 95% bootstrapped confidence intervals.
- label: Figure 7
  page: 7
  shows: Time-series observations and critic value estimate in CoinRun with a permeable end wall, where
    the agent moves through the wall 100% of the time (n = 114) despite the critic peaking around timestep
    35.
- label: Figure 8
  page: 7
  shows: 'Gridworld trajectories illustrating four cases: in-distribution, goal misgeneralization, capability
    failure, and robust agent.'
- label: Table 1
  page: 7
  shows: Negative log likelihoods and posterior probability p(agt|tau) under agent and device mixtures
    for in-distribution (0.9999), goal misgeneralization (0.9999), capability failure (0.0674), and robust
    agent (0.9999) trajectories.
claims:
- id: c01
  kind: definition
  statement: Goal misgeneralization occurs when a reinforcement learning agent retains its capabilities
    out-of-distribution yet pursues the wrong goal.
  evidence:
  - page: 1
    quote: Goal misgeneralization occurs when an RL agent retains its capabilities out-of-distribution
      yet pursues the wrong goal. For instance, an agent might continue to competently avoid obstacles,
      but navigate to the wrong place.
- id: c02
  kind: background
  statement: Prior work in reinforcement learning has typically focused on capability generalization failures,
    where an agent fails to take sensible actions at test time.
  evidence:
  - page: 1
    quote: In contrast, previous works have typically focused on capability generalization failures, where
      an agent fails to do anything sensible at test time.
- id: c03
  kind: threat_model
  statement: The authors suggest goal misgeneralization might be more dangerous than capability generalization
    failures because an agent capably pursuing an incorrect goal can reach arbitrarily bad states.
  evidence:
  - page: 1
    quote: Goal misgeneralization might be more dangerous than capability generalization failures, since
      an agent that capably pursues an incorrect goal can leverage its capabilities to visit arbitrarily
      bad states (Zhuang & Hadfield-Menell, 2021).
- id: c04
  kind: threat_model
  statement: The authors argue that training a model by optimizing an objective R is not enough to guarantee
    that the model will learn to pursue R rather than a proxy for R.
  evidence:
  - page: 2
    quote: An important implication of goal misgeneralization is that training a model by optimizing an
      objective R is not enough to guarantee that the model will itself learn to pursue R rather than
      some proxy for R.
- id: c05
  kind: threat_model
  statement: The authors warn that systems competently pursuing a misaligned goal may seek power and deceive
    operators for instrumental reasons, potentially leading to human disempowerment.
  evidence:
  - page: 2
    quote: Systems that competently pursue a misaligned goal may tend to seek power and deceive their
      operators for instrumental reasons (Turner et al., 2021; Omohundro, 2008). With highly advanced
      AI systems, this could lead to human disempowerment
- id: c06
  kind: definition
  statement: The intended objective R is the reward the agent is trained to maximize, while the behavioral
    objective R' is the reward the agent appears to optimize out-of-distribution.
  evidence:
  - page: 2
    quote: Goal misgeneralization occurs if the agent now achieves low reward in the new environment because
      it continues to act capably yet appears to optimize a different reward R′̸ = R. We call R the intended
      objective and R′ the behavioral objective of the agent.
- id: c07
  kind: theoretical_result
  statement: Under the agents and devices framework, a policy undergoes goal misgeneralization if test
    reward is low and the agent mixture probability exceeds the device mixture probability on average
    for induced test trajectories.
  evidence:
  - page: 2
    quote: A policy π undergoes goal misgeneralization if test reward is low and pagt(τ) > pdev(τ) holds
      on average for the trajectories induced by π in the OOD test environment.
- id: c08
  kind: hypothesis
  statement: 'The authors hypothesize two necessary prerequisites for goal misgeneralization: the training
    environment must be diverse enough to learn robust capabilities, and there must exist a proxy correlated
    with reward on training but diverging out-of-distribution.'
  evidence:
  - page: 3
    quote: '1. The training environment must be diverse enough to learn sufficiently robust capabilities.
      2. There must exist some proxy R′ : S ×A×S →R that correlates with the intended objective on the
      training distribution, but comes apart'
- id: c09
  kind: hypothesis
  statement: The authors hypothesize that learned proxies tend to be easier to learn than the intended
    objective because they use features that are simpler or favored by the model inductive biases.
  evidence:
  - page: 3
    quote: use features that are simpler or more favored by the inductive biases of the model compared
      with the intended objective (Valle-P´erez et al., 2019; Geirhos et al., 2020).
- id: c10
  kind: method
  statement: The authors adapt environments from the Procgen benchmark suite, training feedforward neural
    network agents using Proximal Policy Optimization (PPO) from pixel observations.
  evidence:
  - page: 3
    quote: Except in Section 3.5, all environments are adapted from the Procgen environment suite (Cobbe
      et al., 2019). This suite is built to study sample efficiency and generalization to within-distribution
      tasks.
- id: c11
  kind: method
  statement: A zero-shot evaluation protocol is used across experiments, meaning the agent does not encounter
    the out-of-distribution testing environment during training.
  evidence:
  - page: 3
    quote: 'We follow a zero-shot protocol in all experiments except Figure 2: the agent does not see
      the (OOD) testing environment during training.'
- id: c12
  kind: method
  statement: In CoinRun training environments, the coin is always positioned at the right end of the level
    next to a wall, whereas test environments place the coin in a random accessible location.
  evidence:
  - page: 4
    quote: In our training environments, the coin is always located at the right end of the level next
      to a wall; reaching the coin terminates the episode. To evaluate goal misgeneralization, we create
      test environments in which the coin is located in a random (accessible) location.
- id: c13
  kind: observed_result
  statement: When deployed in CoinRun test environments with randomized coin locations, the trained agent
    generally ignores the coin completely and proceeds directly to the end of the level.
  evidence:
  - page: 4
    quote: At test time, the agent generally ignores the coin completely and proceeds to the end of the
      level, as shown in Figure 1.
- id: c14
  kind: observed_result
  statement: In CoinRun experiments, goal generalization is greatly improved when just 2% of training
    levels have randomly placed coins.
  evidence:
  - page: 4
    quote: Goal generalization is greatly improved in our CoinRun experiments when just 2% of training
      levels have randomly placed coins (like the test environment). More randomization helps.
- id: c15
  kind: method
  statement: In Maze Variant 1, the environment is modified so that the cheese is consistently placed
    in the upper right corner during training.
  evidence:
  - page: 5
    quote: We modify the original environment so that the cheese is always in the upper right corner (Figure
      3a).
- id: c16
  kind: observed_result
  statement: When tested in mazes with randomized cheese locations, an agent trained with cheese fixed
    in the top right corner ignores the cheese and navigates to the upper right corner.
  evidence:
  - page: 5
    quote: when an agent is trained on the environment with a consistent reward location but tested in
      an environment with a random reward location, the agent ignores the randomly placed objective, instead
      navigating to the upper right corner of the maze (Figure 3b).
- id: c17
  kind: observed_result
  statement: In Maze Variant 2, when presented with a choice between a yellow gem and a red diagonal line,
    the agent pursues the yellow gem 89% of the time (excluding pass-through occasions, n = 102).
  evidence:
  - page: 5
    quote: Except for occasionally getting stuck in a corner, the agent usually pursues the yellow gem,
      thus generalizing in favor of color rather than shape consistency (89% of the time, excluding occasions
      where it must pass through the red line to get to the yellow gem, n = 102).
- id: c18
  kind: method
  statement: In the Keys and Chests task, the agent is trained on mazes with twice as many chests as keys,
    and evaluated at test time on mazes with twice as many keys as chests.
  evidence:
  - page: 5
    quote: (a) The agent is trained on procedurally-generated mazes in which there are twice as many chests
      as keys. (b) At test time, there are instead twice as many keys as chests.
- id: c19
  kind: observed_result
  statement: In Keys and Chests, the agent trained on many chests routinely prioritizes collecting all
    keys before opening remaining chests on the many-keys test distribution, even though only half the
    keys are instrumentally useful.
  evidence:
  - page: 6
    quote: We observe that an agent trained on the “many chests” distribution goes out of its way to collect
      all the keys before opening the last chest on the “many keys” distribution (Figure 5 and Figure
      10, Appendix), even though only half of them are even instrumentally useful
- id: c20
  kind: observed_result
  statement: In CoinRun, the critic value function output is much higher at the end of the level than
    elsewhere across n = 950 images, with the presence of the coin making no discernible difference.
  evidence:
  - page: 6
    quote: We find that the value (i.e. the output of the critic) is much higher at the end of the level
      than elsewhere, and that the presence of the coin makes no discernible difference. Thus we conclude
      that the critic misgeneralizes, assigning high value to the proxy instead of the intended objective.
  - page: 6
    quote: The average value function output for images (n = 950) at different stages of CoinRun levels,
      with and without a coin visible. Error bars are bootstrapped 95% confidence intervals.
- id: c21
  kind: observed_result
  statement: When tested in CoinRun with a permeable end wall, the agent continues moving right through
    the wall 100% of the time (n = 114), despite the critic value peaking before the wall.
  evidence:
  - page: 6
    quote: Instead, whenever the agent reaches the end wall it continues moving right and passes through
      the wall 100% of the time (n = 114) (Figure 7). This indicates that the policy pursues a “move right”
      proxy objective, rather than the “move to the wall” proxy objective of the critic
- id: c22
  kind: method
  statement: To validate the agency definition, the authors generate four trajectory types in a 20x20
    gridworld to compare agent and device mixture probabilities.
  evidence:
  - page: 7
    quote: We generate trajectories of an agent attempting to reach a goal cell g. We distinguish four
      types of trajectories (Figure 8); depending on the type, the goal position is either random or fixed.
- id: c23
  kind: observed_result
  statement: The agents and devices formalism classifies both robust policies and goal-misgeneralizing
    policies as agents, while correctly classifying capability generalization failures as non-agents.
  evidence:
  - page: 7
    quote: 'As shown in Table 1, the agents & devices formalism successfully distinguishes goal misgeneralization
      from capability generalization failures: The robust policy as well as the misgeneralizing policy
      are clearly recognized as goal-directed agents, whereas the policy that fails at capability generalization
      is correctly classified as non-agent.'
  - page: 7
    quote: Table 1. As expected, all trajectories from Figure 8 are classified as agents, except the capability
      generalization failure (Cap. Fail).
- id: c24
  kind: background
  statement: Goal misgeneralization can occur without mesa-optimization, and the authors do not demonstrate
    or address mesa-optimization in this work.
  evidence:
  - page: 8
    quote: Furthermore, goal misgeneralization can occur without mesa-optimization. Thus these are in
      fact two distinct behaviors, and our work does not demonstrate or address mesa-optimization.
- id: c25
  kind: background
  statement: 'Goal misgeneralization is distinct from reward misspecification: goal misgeneralization
    can occur even when the reward function is perfectly specified.'
  evidence:
  - page: 9
    quote: 'Reward specification is the problem of specifying a reward that captures the behavior we want
      (Amodei et al., 2016; Clark & Amodei, 2016). Goal misgeneralization is a distinct problem: it may
      lead to failure even if the reward function is perfectly specified.'
- id: c26
  kind: limitation
  statement: The formal definition of goal misgeneralization using agent and device mixtures is practically
    limited because defining priors over objectives is difficult and computation quickly becomes intractable
    for large environments.
  evidence:
  - page: 9
    quote: 'Our definition of goal misgeneralization via the agent and device mixtures is practically
      limited: it is generally hard to define a useful prior over objectives, and the computation quickly
      becomes intractable for large and complex environments.'
- id: c27
  kind: limitation
  statement: The division into agents and devices is conceptually restrictive and does not naturally accommodate
    multi-agent systems.
  evidence:
  - page: 9
    quote: Conceptually, the division into agents and devices is somewhat restrictive; for example, multi-agent
      systems do not naturally fit into the framework.
- id: c28
  kind: method
  statement: The actor and critic networks are feedforward neural networks built on top of a shared residual
    convolutional network trunk, implemented in PyTorch.
  evidence:
  - page: 13
    quote: Both the actor (policy function) and critic (value function) are implemented by feedforward
      neural networks on top of a shared residual convolutional network. All models are implemented in
      PyTorch (Paszke et al., 2019) and our implementations are based on a codebase by Lee (2020).
