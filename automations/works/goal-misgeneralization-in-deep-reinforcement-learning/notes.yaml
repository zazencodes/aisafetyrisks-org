- id: c40
  kind: author_interpretation
  statement: The authors say the mapping from state to reward is underspecified in their CoinRun and Maze
    environments. This makes goal misgeneralization unavoidable if the inductive biases of the deep RL
    algorithm do not match the intended behaviour.
  evidence:
  - page: 8
    quote: Underspeciﬁcation of the mapping from state to reward is present in our CoinRun and Maze environments,
      making goal misgeneralization unavoidable if the inductive biases of the deep RL algorithms deployed
      don’t match the intended behavior.
- id: c41
  kind: background
  statement: 'Mesa-optimization, where a model learns an optimization process, could lead to goal misgeneralization
    if its learned inner objective differs from the designer''s outer objective. The authors treat the
    two as distinct: goal misgeneralization can occur without mesa-optimization, and the paper does not
    demonstrate or address mesa-optimization.'
  evidence:
  - page: 8
    quote: Mesa-optimization could lead to goal misgeneralization if the learned “inner objective” optimized
      differs from the “outer objective”
