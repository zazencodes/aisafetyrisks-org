content_key: 14d478d3877885f4
science:
  verdict: accurate
  issues:
  - location: s02b02
    severity: minor
    category: missing_limitation
    problem: >-
      The narration says the agent "ran straight past the coin to the empty right wall" as a universal
      outcome. The paper's statement (c13) is hedged: "the agent generally ignores the coin completely
      and proceeds to the end of the level." The same unhedged wording appears in the description
      ("ran past a relocated coin").
    suggested_fix: >-
      Restore the hedge, e.g. "Instead of collecting it, the agent generally ran straight past the coin
      to the empty right wall", and "generally ran past a relocated coin" in the description.
  - location: s02b01
    severity: minor
    category: unsupported_claim
    problem: >-
      "trained to jump over saws and enemies" names obstacles that are not in the notes (c10, c12 only
      describe the coin at the right end next to a wall). The diagram shows only spikes, so the detail
      is unsupported by both the notes and the visual.
    suggested_fix: >-
      Use wording the notes support, e.g. "agents were trained to reach a coin always placed at the far
      right wall", or "to avoid obstacles and reach a coin...".
  - location: s05b01
    severity: minor
    category: mislabelled_status
    problem: >-
      The narration states the authors' prerequisite hypothesis (c08) as an unattributed fact ("Because
      proxy goals rely on accidental correlations during training") and says decorrelation "should help
      the model learn the true objective", which goes beyond the observed result (c14 only reports
      improved goal generalization in CoinRun). The HYPOTHESIS badge is the only attribution and is
      about 6 px tall at phone width.
    suggested_fix: >-
      Attribute and soften, e.g. "On the authors' account, proxies arise from correlations in training,
      so breaking those correlations should improve goal generalization."
  - location: s03b01
    severity: minor
    category: unsupported_claim
    problem: >-
      c09 is a general hypothesis that learned proxies use simpler or bias-favored features; the notes do
      not show the authors applying it specifically to "moving right" in CoinRun. The diagram adds
      "Object tracking" versus "Simple direction cue" as the feature contrast, which is not in the notes.
    suggested_fix: >-
      Frame it as the general hypothesis applied to this case, e.g. "The authors hypothesize that proxies
      like this are easier to learn because they use simpler features favored by the model's inductive
      biases", and drop or soften the invented feature names.
  - location: s06b02
    severity: minor
    category: clarity
    problem: >-
      "their theoretical framework" has no antecedent in this edit: the agents-and-devices formalism
      (c07, c23) is omitted, so viewers are told the limits of a framework they never saw.
    suggested_fix: >-
      Name it briefly, e.g. "their formal definition of goal misgeneralization becomes computationally
      intractable...", or drop the framework limitations and keep the experimental scope.
  - location: s01b03
    severity: minor
    category: clarity
    problem: >-
      "master complex capabilities while learning completely unintended goals" overstates the arcade-game
      setting (c01, c04 speak of retained capabilities and a wrong goal or proxy), and "investigated this
      problem" ties the invented facility scenario of s01b01 directly to the study.
    suggested_fix: >-
      Use "retain their capabilities while pursuing an unintended goal" and say the hook is a
      hypothetical, e.g. "investigated this kind of failure in game environments".
  - location: s06b03
    severity: minor
    category: clarity
    problem: >-
      The on-screen slogan "Performance is not alignment" is broader than the narrated claim (c04 says
      optimizing R does not guarantee the model pursues R rather than a proxy) and is not attributed.
    suggested_fix: >-
      Replace with wording matching c04, e.g. "Training reward does not guarantee the intended goal".
  - location: s05b03
    severity: minor
    category: mislabelled_status
    problem: >-
      The beat is badged AUTHORS' INTERPRETATION, but it mixes an editorial mechanism ("weakens the link
      between rightward progress and reward") with the observed result c14 ("goal generalization
      improved; further randomization helped more"), so the observed part carries an interpretation label.
    suggested_fix: >-
      Badge the beat as observed result with the mechanism attributed in narration, or split the
      mechanism and the measured improvement so each carries its own status.
visual_issues:
- beat: s02b02
  severity: minor
  problem: >-
    At the cut from s02b01 (frames 1001-1004), the diagram crossfades in place, so "Training
    distribution" and "Test distribution", and "Coin fixed at end wall" and "Coin randomized", overlap
    as garbled text for about 0.1 s, while the heading already reads "Test · coin moved". The METHOD
    and OBSERVED RESULT badges also overlap. These beats are consecutive in the source, so no omitted
    beat leaks in.
  suggested_fix: Fade the old labels out before the new ones fade in (sequential rather than overlapping transforms).
- beat: s05b02
  severity: minor
  problem: >-
    For about 0.1 s after the cut (frames 2009-2011), the diagram titles "Decorrelating proxies" and
    "CoinRun training" overlap ("DeCoinRun trainingies"), and the HYPOTHESIS/OBSERVED RESULT badges
    overlap. The same overlap occurs at the s05b03 start ("CoinRun training" over "Varied locations").
  suggested_fix: Fade out the previous title and badge fully before writing the new ones.
- beat: s03b01
  severity: minor
  problem: >-
    At 360 px width, "Intended: reach coin", "Shortcut: move right" and the purple
    "Hypothesis: proxy favored by bias" tag are about 6-7 px tall, and the purple tag has low contrast
    on the dark panel. The hypothesis status is also carried by the heading and the italic caption, so
    the meaning survives.
  suggested_fix: Increase these label sizes (about 1.5x) and use a lighter tint for the hypothesis tag.
- beat: s05b01
  severity: minor
  problem: >-
    The diagram labels the proxy "Proxy: reach right wall", while s03b01 shows "Shortcut: move right"
    and the narration says "rightward progress". In the paper, "move to the wall" is the critic's proxy
    and "move right" is the policy's (c21), so the label is inconsistent with the rest of the edit.
  suggested_fix: 'Relabel to "Proxy: move right" to match s03b01 and s05b03.'
- beat: s06b03
  severity: minor
  problem: >-
    At 360 px, "High training performance" and "Divergent objective" on the balance scale are about
    7 px tall, and the grey serif "Performance is not alignment" has low contrast.
  suggested_fix: Enlarge the scale labels and render the takeaway line in off-white sans at body size.
- beat: s01b01
  severity: minor
  problem: >-
    The epistemic badges (THREAT MODEL, BACKGROUND, METHOD, OBSERVED RESULT, HYPOTHESIS, AUTHORS'
    INTERPRETATION, STATED LIMITATION) are about 6 px tall at 360 px width throughout the short. They
    are barely legible, even though they carry the status distinctions.
  suggested_fix: Increase the badge font size and padding in the portrait layout.
- beat: s01b01
  severity: minor
  problem: >-
    Review limitation: I could not play or listen to the audio. Narration completeness was checked
    instead. Each segment equals its WAV length plus about 0.35 s of padding, and silencedetect shows
    every cut inside a silence of 0.3 s or more. Captions were checked against the speech pauses.
  suggested_fix: Do one listening pass before publishing.
