thumbnail:
  headline: It skipped the coin
  visual: The CoinRun corridor, large and simple. The blue agent is mid-leap on a high arc that passes
    over the golden coin and lands at the empty end wall on the right; the coin sits untouched in the
    middle of the floor. No labels.
