doi: null
abstract: We study goal misgeneralization, a type of out-of-distribution generalization failure in reinforcement
  learning (RL). Goal misgeneralization failures occur when an RL agent retains its capabilities out-of-distribution
  yet pursues the wrong goal. For instance, an agent might continue to competently avoid obstacles, but
  navigate to the wrong place. In contrast, previous works have typically focused on capability generalization
  failures, where an agent fails to do anything sensible at test time. We formalize this distinction between
  capability and goal generalization, provide the first empirical demonstrations of goal misgeneralization,
  and present a partial characterization of its causes.
