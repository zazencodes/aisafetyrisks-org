title: When an AI Learns the Shortcut | Goal Misgeneralization
description: 'In a hypothetical warehouse, an AI might navigate perfectly yet deliver to the familiar bay after
  the requested destination changes. That situation is an analogy, not a finding of this paper. It frames the question:
  when a cue that worked in training parts ways with the real goal, which one will the system follow?


  Langosco and colleagues studied this in modified games. In CoinRun, a trained agent generally went to the end
  of a level after the rewarded coin moved. In Keys and Chests, an agent kept gathering keys when extra keys no
  longer helped it open chests. The video explains the authors’ interpretations and the CoinRun training change
  that improved goal generalization.


  These experiments do not measure deployed AI systems. The particular proxy goals are hypotheses, and the broader
  safety risk is a threat model. The paper and its evidence register accompany the video.'
