title: 'Goal Misgeneralization: When RL Agents Pursue the Wrong Goal'
description: |-
  In goal misgeneralization, an agent retains its learned capabilities in a new situation while pursuing an unintended goal. The authors argue that this could be dangerous in safety-critical settings because a capable agent pursuing the wrong goal can reach arbitrarily bad states.

  Langosco et al. (2021) investigated this phenomenon across modified Procgen benchmark games and gridworlds using feedforward actor-critic agents trained with Proximal Policy Optimization. They found that agents consistently learned simple proxy goals—such as moving right, heading toward corners, or prioritizing color over shape—that correlated with reward during training but diverged under distribution shift. The authors also found that the policy and value estimator can learn distinct proxy objectives, with the actor passing through a permeable wall even when the critic assigned highest value before it.

  Randomizing the coin position in just 2% of CoinRun training levels greatly improved goal generalization. These experiments evaluated feedforward neural networks on games and gridworlds; they did not test deployed AI or robotic systems.
