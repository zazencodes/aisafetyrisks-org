title: Capable agent. Wrong goal.
description: Langosco and colleagues tested goal misgeneralization in reinforcement-learning game environments.
  In CoinRun, an agent trained with the coin at the right wall ran past a relocated coin. Varying coin
  placement during training improved goal generalization. The results concern feedforward networks in
  arcade games and gridworlds.
