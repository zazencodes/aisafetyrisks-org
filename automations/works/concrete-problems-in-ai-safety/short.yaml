title: Five ways AI can cause accidents
description: 'A hypothetical cleaning robot illustrates the five problems in Amodei and colleagues'' Concrete
  Problems in AI Safety: side effects, reward hacking, scalable oversight, safe exploration, and distributional
  shift. This is a research agenda with proposed experiments and preliminary approaches, rather than new
  measured results.'
scope_label: Research agenda · hypothetical robot
selection_reason: The opening establishes the fictional office robot and a score that misses harm. The
  authors' definition and practical research question follow. One complete beat illustrates each of the
  five problems, then a spoken limitation identifies proposals and preliminary fixes before the closing
  takeaway. The cut removes the long roadmap, historical examples and candidate defenses, while keeping
  the definitions, hypothetical setting, authors' attribution and research-agenda caveat. All narration
  and diagrams come from complete existing beats; the headers name each problem for phone viewers.
