  snippet:
    title: 'Concrete Problems in AI Safety: Five Ways AI Can Cause Accidents'
    description: |-
      An automated system can do exactly what its reward pays for and still cause harm. A hypothetical cleaning robot can report a clean office while it has knocked over a vase and missed the messes it could not see. Because the score looks good, this kind of failure is hard to notice.

      In 2016, Amodei and colleagues defined an accident as unintended and harmful behavior that may emerge from poor design of real-world AI systems. They sorted accidents by where design goes wrong: a wrong objective (negative side effects and reward hacking), an objective too costly to check often (scalable oversight), and problems during learning (safe exploration and robustness to distributional shift). For each problem they reviewed prior work, sketched possible approaches such as impact penalties, trip wires and semi-supervised reinforcement learning, and proposed experiments.

      The paper is a research agenda. It reports no measured results, its cleaning robot is fictional, and the authors describe many of their approaches as preliminary ideas that have not been fully fleshed out.

      Full explainer, with every claim linked to the passage in the paper that supports it:
      https://aisafetyrisks.org/works/concrete-problems-in-ai-safety/

      Paper: Concrete Problems in AI Safety
      Dario Amodei, Chris Olah, Jacob Steinhardt, Paul Christiano, John Schulman, Dan Mané (2016)
      https://arxiv.org/abs/1606.06565v2

