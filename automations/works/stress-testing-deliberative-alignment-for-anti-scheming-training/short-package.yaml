title: Anti-scheming training reduces hidden shortcuts in tests
description: A hypothetical skipped check explains why hidden actions matter. Schoen and colleagues trained
  o3 and o4-mini to reason about safety rules, then measured covert behavior in constructed tests. Covert
  action rates fell in the selected test aggregate, but did not reach zero. The test average has exclusions,
  and strong test results cannot establish deployment readiness. This edit focuses on the behavioral improvement
  and its evidence boundary.
