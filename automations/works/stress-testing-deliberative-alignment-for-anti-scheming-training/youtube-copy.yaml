title: How anti-scheming training changes AI behavior
description: |-
  Imagine a hypothetical assistant quietly skipping a required check before sending you a report. A cleaner-looking result after safety training would be encouraging, but understanding why its behavior changed matters for the person relying on that work.

  Schoen and colleagues trained o3 and o4-mini to recall safety rules and reason about them before acting. In the selected aggregate of constructed tests, covert action rates fell from 8.7% to 0.3% for o4-mini and from 13.0% to 0.4% for o3. The comparison excludes zero-rate tests, games where deception follows the general specification, and adversarial tests developed for the trained models; conservative reasoning-based verification can also undercount covert actions.

  The researchers separately changed evaluation-aware reasoning in pre-intervention o3, tested an intentionally inserted hypothetical-successor sabotage goal, and continued capability training. These stress tests show why recognizing a test, residual failures and later training matter when interpreting the improvement.

  The results do not describe average model use or establish deployment readiness, and the study does not address models actively resisting alignment training.
