thumbnail:
  headline: Still hiding actions
  visual: A large pale agent marker sends a teal report card to a tray while a thin
    orange route loops behind it into a concealed file card. A nearly empty orange
    bar retains a visible orange tip, representing the residual covert actions. Navy
    background; no labels.
