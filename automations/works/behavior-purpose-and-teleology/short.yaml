title: How goal-directed correction can go wrong
description: A hypothetical delivery robot can correct its route while still heading to the wrong room.
  This short uses the January 1943 essay’s definitions and its imagined overshooting machine to explain
  purpose and negative feedback. The essay is a conceptual classification, not a test of modern AI safety
  or a method for choosing safe goals.
scope_label: Conceptual essay · hypothetical examples
selection_reason: The opening establishes the robot and its hypothetical status before the wrong-room
  example. The named-author context introduces the essay; purpose and negative feedback are defined before
  damping and the imagined light-guided failure. The complete spoken evidence boundary and takeaway remain.
  Clock, active/passive classification and prediction are omitted to keep one mechanism self-contained.
