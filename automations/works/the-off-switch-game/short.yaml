title: Why an AI might allow shutdown
description: The Off-Switch Game studies a single human–robot decision mathematically. Uncertainty about
  human preferences can make waiting for a rational human's decision valuable. If human decisions are
  noisy, waiting can lose that advantage. These are results within the model, with limits for longer interactions
  and mistaken models of people.
scope_label: One-shot mathematical game
selection_reason: Establish the hypothetical delivery robot, then identify the mathematical game and its
  human-preference objective. Keep the act-or-wait choices, rational-human result and uncertainty mechanism,
  then the noisy-human assumption and loss of the waiting advantage. The spoken one-shot and information-source
  limitations precede the authors' takeaway. Remove utility notation, duplicate payoff explanations and
  the designer simulation to focus on the conditions under which uncertainty makes oversight valuable.
