    problem: At 360x640 phone size, the nested one-shot diagram makes its Human feedback label and the
      Other information label small. The portrait heading, scope and captions remain readable, and narration
      states the one-shot and information-source limitations supported by c30, c31 and c32; the small
      labels do not change the scientific meaning.
    suggested_fix: Enlarge these labels in the source scene or add readable portrait labels when the source
      animation is next revised, retaining the distinction between modeled and alternative information
      sources.
  - beat: s01b01
    severity: minor
    problem: 'Review limitation: I inspected the full contact sheet, all segment start/end frames, additional
      actual-video frames at phone size, and burned-caption scripts. All 56 cues have at most two lines
      and one accent color, and their shortest duration is 1.41 seconds. Each selected WAV fits its segment
      with 0.347–0.367 seconds of padding; both muxed streams last 140.2 seconds. Continuous playback
      and listening were unavailable, so these checks do not establish perceived audio continuity or caption-to-speech
      synchronization.'
    suggested_fix: Play and listen to the complete draft before posting, checking cut continuity and synchronization
      at proportional caption boundaries.
