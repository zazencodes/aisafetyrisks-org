title: Why an AI might allow shutdown
description: The Off-Switch Game studies a single human–robot decision mathematically. Uncertainty about
  human preferences can make waiting for a rational human's decision valuable. If human decisions are
  noisy, waiting can lose that advantage. These are results within the model, with limits for longer interactions
  and mistaken models of people.
