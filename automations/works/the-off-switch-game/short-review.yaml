science:
  verdict: accurate
  issues:
  - location: s01b04
    severity: minor
    category: clarity
    problem: >-
      "ask when an agent would instead benefit from letting a human stop it" relies on the omitted
      s01b03 threat model (c01, c02: pursuing an objective can create an incentive to prevent
      shutdown). In this edit the hook only shows someone reaching for the stop button, so "instead"
      has no stated antecedent. The clause "with the robot able to bypass the human's control"
      partly supplies the tension, but only after the word "instead".
    suggested_fix: >-
      Drop "instead" ("ask when an agent would benefit from letting a human stop it"), or add a
      short attributed clause about the authors' concern that systems might adopt subgoals that
      prevent shutdown (c01).
  - location: s02b03
    severity: minor
    category: clarity
    problem: >-
      The heading "Act now, or wait for a person?" and the narration present only acting and
      waiting. The robot's third option, stopping itself (s02b04, omitted), first appears in s04b02
      ("act directly or stop itself"). Viewers meet "stop itself" without having seen it as a choice,
      and "the robot's best alternative" in s03b01 has no complete list of alternatives.
    suggested_fix: >-
      Mention the self-stop option in s04b02's wording ("its other options: acting directly or
      switching itself off"), or select a beat that introduces all three choices.
  - location: s04b02
    severity: minor
    category: missing_limitation
    problem: >-
      The short says waiting "can lose its advantage" with a noisy human, but does not say when.
      In the notes (Figure 3, c24) this happens for low robot uncertainty combined with high human
      suboptimality and a nonzero mean, and waiting stays optimal at zero mean. "If it expects
      oversight to make the choice worse" is a fair plain-language paraphrase, so this is unlikely
      to mislead, but the dependence on the robot's own uncertainty is lost.
    suggested_fix: >-
      Add a condition, for example "especially when the robot is fairly confident and the human's
      choices are noisy".
  - location: s05b02
    severity: minor
    category: missing_limitation
    problem: >-
      The narration states that the human's shutdown decision is the robot's only source of
      information, but leaves out why this matters (c32): with other information sources the robot
      may have incentives to disable its switch, learn, and then decide. Also, "mistaken models of
      people" narrows the paper's broader "model misspecification" (c31).
    suggested_fix: >-
      Add "with other information sources, the paper notes the robot might gain an incentive to
      disable its switch" and say "mistaken models" or "model misspecification" in place of
      "mistaken models of people".
  - location: s05b03
    severity: minor
    category: clarity
    problem: >-
      "The authors' proposal is to preserve that uncertainty honestly" paraphrases c29 ("accurately
      represent the inherent uncertainty"). Because the edit omits c25 and the underconfidence half
      of c29, "preserve" could be read as "keep the robot uncertain" or "more uncertainty is
      better". "Honestly" partly carries the idea of accuracy.
    suggested_fix: >-
      Say "to represent that uncertainty accurately, neither overconfident nor more uncertain than
      warranted", which keeps c29's two-sided warning.
visual_issues:
- beat: s05b02
  severity: major
  problem: >-
    On the exact first frame of s05b02 (frame 3261, t=108.70 s, cut from the abstract s04b02 tree)
    the full s05b01 illustration is already on screen: the cart, doorway, translucent amber
    uncertainty halo along the path, coral stop marker on the path, human circle with amber
    signal/feedback arrows, and the bold "Human feedback" label. All of these are built and
    explained only in the omitted s05b01 ("treated a person's intervention as evidence that its
    planned action might be wrong"). The halo and "Human feedback" stay through all of s05b02,
    inside the "One-shot game" frame, and return enlarged as the main s05b03 diagram. Nothing in
    the selected narration explains the halo around the path, and "Human feedback" is an
    omitted-beat label.
  suggested_fix: >-
    Make s05b02 build its own state: start from the hook's cart and doorway, and add the human
    channel within s05b02 with a label tied to this narration (for example "Shutdown decision:
    only information source"), adding the halo only when uncertainty is spoken in s05b03.
    Otherwise end s05b01 by clearing its halo, arrows and label before the s05b02 boundary. Then
    rerender the scene and the short.
- beat: s03b03
  severity: minor
  problem: >-
