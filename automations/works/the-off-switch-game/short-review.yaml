    brighter ink, and enlarge the epistemic badges.
- beat: s05b02
  severity: minor
  problem: >-
    The caption breaks leave the 0.78 s orphan cue "This models" before the italic phrase. In
    s03b01, "they allow an action that benefits" splits "benefits | them" across cues. All cues
    are at most two lines, in the same off-white ink, and stay close to the speech, so
    understanding is not obstructed.
  suggested_fix: >-
    Merge "This models" with the emphasized phrase into one two-line cue, and keep "benefits them"
    together.
- beat: s01b01
