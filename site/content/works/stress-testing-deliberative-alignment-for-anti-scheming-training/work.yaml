title: How anti-scheming training changes AI behavior
dek: Training o3 and o4-mini reduced covert actions in constructed tests, but residual failures, evaluation
  awareness and later training limit what the gains establish.
category: deception
paper:
  title: Stress Testing Deliberative Alignment for Anti-Scheming Training
  authors:
  - Bronson Schoen
  - Evgenia Nitishinskaya
  - Mikita Balesni
