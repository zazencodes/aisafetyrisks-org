summary: 'This study gives a concrete way to assess an anti-scheming intervention: examine behavior in
  unfamiliar tasks and ask whether evaluation awareness explains apparent improvements. Subsequent monitoring
  research addresses a related question—how to detect misbehavior that training may leave behind. These
  complementary approaches help frame the need to evaluate both training and oversight.'
examples:
- title: Evaluating chain-of-thought monitorability
  url: https://openai.com/index/evaluating-chain-of-thought-monitorability/
  year: 2025
  description: This related OpenAI research develops evaluations for how reliably a monitor can detect
    properties of an agent’s behavior from its reasoning. It also warns that benchmark results may not
    carry over to detecting misbehavior outside evaluations. Monitoring is a complementary safeguard,
    with its own limitations.
  source_passage: results may not generalize to detecting misbehavior in the wild
- title: How we monitor internal coding agents for misalignment
  url: https://openai.com/index/how-we-monitor-internal-coding-agents-misalignment/
  year: 2026
  description: 'OpenAI describes a monitoring system for coding agents used internally. This is related
    deployment work, rather than a replication of the anti-scheming experiment: it illustrates why training
    interventions need to be considered alongside detection and investigation of possible misbehavior.'
  source_passage: we’ve built and refined a monitoring system for coding agents
