[project]
name = "aisr-site"
version = "0.1.0"
description = "Static site generator for aisafetyrisks.org"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=4.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.scripts]
aisr-site = "aisr_site.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisr_site"]
