<svg class="story-svg" viewBox="0 0 560 340" role="img" aria-labelledby="feedback-svg-title feedback-svg-desc">
  <title id="feedback-svg-title">AI research forms a feedback loop</title>
  <desc id="feedback-svg-desc">AI helps with research, research produces a more capable AI system, and that system feeds the next cycle. A separate evaluation track illustrates the possibility of oversight falling behind.</desc>
  <defs>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" class="arrow-tip"/></marker>
  </defs>
  <circle class="feedback-track" cx="280" cy="156" r="100"/>
  <g class="feedback-orbit" data-motion="orbit" data-beat="3">
    <circle cx="280" cy="56" r="6"/>
  </g>
  <path class="feedback-route" d="M212 83 Q280 29 351 83" marker-end="url(#feedback-arrow)" data-motion="draw" data-beat="1"/>
  <g class="ai-node" data-motion="reveal" data-beat="1">
    <rect x="123" y="68" width="103" height="65" rx="12"/>
    <text x="174" y="109" text-anchor="middle" class="svg-ai">AI</text>
  </g>
  <g class="research-node" data-motion="reveal" data-beat="1">
    <rect x="339" y="68" width="114" height="65" rx="12"/>
    <text x="396" y="108" text-anchor="middle">Research</text>
  </g>
  <path class="feedback-route" d="M384 137 Q398 216 333 244" marker-end="url(#feedback-arrow)" data-motion="draw" data-beat="2"/>
  <g class="improved-node" data-motion="reveal" data-beat="2">
    <rect x="211" y="224" width="138" height="58" rx="12"/>
    <text x="280" y="260" text-anchor="middle">Better AI</text>
  </g>
  <path class="feedback-route" d="M215 242 Q155 202 174 137" marker-end="url(#feedback-arrow)" data-motion="draw" data-beat="2"/>
  <g class="feedback-center" data-motion="reveal" data-beat="3">
    <text x="280" y="157" text-anchor="middle">Faster cycles</text>
    <text x="280" y="177" text-anchor="middle" class="svg-small">less time to evaluate</text>
  </g>
  <path class="evaluation-track" d="M114 316 H444"/>
  <g class="evaluation-marker" data-motion="evaluate" data-beat="3">
    <circle cx="216" cy="316" r="5"/>
    <text x="216" y="304" text-anchor="middle" class="svg-small">Evaluation</text>
  </g>
</svg>
